# Builds the APK in the cloud (no Android Studio needed): GitHub > Actions > "Build APK" > Run workflow > download the artifact.
name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SKIP_GAME_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: International-Life-apk
          path: apk/*.apk
